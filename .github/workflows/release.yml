name: release

on:
  workflow_call:

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download tested release packages
        uses: actions/download-artifact@v8
        with:
          pattern: php_yumemi-*.zip
          path: artifacts
          merge-multiple: true
      - name: Verify release packages
        env:
          PACKAGE_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          packages=()
          for version in 8.2 8.3 8.4 8.5; do
            case "$version" in
              8.2|8.3) compiler=vs16 ;;
              *) compiler=vs17 ;;
            esac
            for ts in nts ts; do
              packages+=("artifacts/php_yumemi-${PACKAGE_REF}-${version}-${ts}-${compiler}-x86_64.zip")
            done
            for ts in nts zts; do
              packages+=("artifacts/php_yumemi-${PACKAGE_REF}_php${version}-arm64-darwin-bsdlibc-${ts}.zip")
            done
          done
          for package in "${packages[@]}"; do
            if [ ! -f "$package" ]; then
              echo "Missing release package: $package" >&2
              exit 1
            fi
          done
          mkdir release-packages
          mv "${packages[@]}" release-packages/
          echo "Verified ${#packages[@]} release packages."

      - name: Publish release packages
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag_ref=$(jq -rn --arg tag "$RELEASE_TAG" '"refs/tags/" + $tag | @uri')
          tag_sha=$(gh api "repos/$GH_REPO/commits/$tag_ref" --jq .sha)
          if [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "Tag $RELEASE_TAG no longer points to the tested commit." >&2
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes ""
          fi
          gh release upload "$RELEASE_TAG" release-packages/*.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false
