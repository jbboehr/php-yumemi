name: release

on:
  workflow_call:
    inputs:
      package-ref:
        required: true
        type: string

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.package-ref }}
      cancel-in-progress: false
    steps:
      - name: Download tested release packages
        uses: actions/download-artifact@v8
        with:
          pattern: php_yumemi-*.zip
          path: artifacts
          merge-multiple: true
      - name: Verify release packages
        env:
          PACKAGE_REF: ${{ inputs.package-ref }}
        run: |
          packages=()
          for version in 8.2 8.3 8.4 8.5; do
            case "$version" in
              8.2|8.3) compiler=vs16 ;;
              *) compiler=vs17 ;;
            esac
            for ts in nts ts; do
              packages+=("artifacts/php_yumemi-${PACKAGE_REF}-${version}-${ts}-${compiler}-x86_64.zip")
            done
            for ts in nts zts; do
              packages+=("artifacts/php_yumemi-${PACKAGE_REF}_php${version}-arm64-darwin-bsdlibc-${ts}.zip")
            done
          done
          for package in "${packages[@]}"; do
            if [ ! -f "$package" ]; then
              echo "Missing release package: $package" >&2
              exit 1
            fi
          done
          mkdir release-packages
          mv "${packages[@]}" release-packages/
          echo "Verified ${#packages[@]} release packages."

      - name: Upload draft release packages
        if: github.event_name == 'push' && (github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release/'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.package-ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          source_ref=$(jq -rn --arg ref "$GITHUB_REF" '$ref | @uri')
          source_sha=$(gh api "repos/$GH_REPO/commits/$source_ref" --jq .sha)
          if [ "$source_sha" != "$RELEASE_SHA" ]; then
            echo "$GITHUB_REF no longer points to the tested commit." >&2
            exit 1
          fi

          # Do not start a branch upload after the version has been tagged.
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            tag_path=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
            tag_exists=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag_path" |
              jq --arg ref "refs/tags/$RELEASE_TAG" 'any(.[]; .ref == $ref)')
            if [ "$tag_exists" = true ]; then
              echo "$RELEASE_TAG already exists; use its tag CI run." >&2
              exit 1
            fi
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft --title "$RELEASE_TAG" --notes ""
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release-packages/*.zip --clobber
          gh release download "$RELEASE_TAG" --pattern 'php_yumemi-*.zip' --dir downloaded-packages
          for package in release-packages/*.zip; do
            cmp "$package" "downloaded-packages/${package##*/}"
          done
          gh release edit "$RELEASE_TAG" --target "$RELEASE_SHA"
          echo "Draft $RELEASE_TAG is ready for inspection at commit $RELEASE_SHA."
