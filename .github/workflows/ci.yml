name: ci

on:
  push:
    branches:
      - master
      - develop
      - "darwin/**"
      - "windows/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  test:
    if: >-
      ${{
        !startsWith(github.head_ref || github.ref_name, 'darwin/') &&
        !startsWith(github.head_ref || github.ref_name, 'windows/')
      }}
    runs-on: ubuntu-latest
    name: "Test | PHP ${{ matrix.php-version }}"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
      - run: phpize
      - run: ./configure --enable-yumemi
      - run: make
      - run: make test
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_ARGS: "-W ${{ runner.temp }}/phpt-results.txt"
          TEST_PHP_JUNIT: "${{ runner.temp }}/phpt-junit.xml"
      - name: Verify PHPT result policy
        run: php scripts/check-phpt-results.php "$RUNNER_TEMP/phpt-results.txt" tests
      - name: Show PHPT logs
        if: failure()
        run: find tests -name '*.log' -exec cat {} \;
      - name: Upload PHPT diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "phpt-linux-${{ matrix.php-version }}"
          path: |
            ${{ runner.temp }}/phpt-junit.xml
            ${{ runner.temp }}/phpt-results.txt
            tests/**/*.diff
            tests/**/*.exp
            tests/**/*.log
            tests/**/*.mem
            tests/**/*.out
            tests/**/*.php
            tests/**/*.sh
          if-no-files-found: ignore

  macos:
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'windows/')) ||
        (github.event_name == 'push' &&
          (github.ref_name == 'develop' ||
            github.ref_name == 'master' ||
            startsWith(github.ref, 'refs/tags/v'))) ||
        startsWith(github.head_ref || github.ref_name, 'darwin/')
      }}
    name: "macOS | PHP ${{ matrix.php-version }} ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.2"
            arch: x64
            runner: macos-15-intel
          - php-version: "8.5"
            arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
      - run: phpize
      - run: ./configure --enable-yumemi
      - run: make
      - run: make test
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_ARGS: "-W ${{ runner.temp }}/phpt-results.txt"
          TEST_PHP_JUNIT: "${{ runner.temp }}/phpt-junit.xml"
      - name: Verify PHPT result policy
        run: php scripts/check-phpt-results.php "$RUNNER_TEMP/phpt-results.txt" tests
      - name: Show PHPT logs
        if: failure()
        run: find tests -name '*.log' -exec cat {} \;
      - name: Upload PHPT diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "phpt-macos-${{ matrix.php-version }}-${{ matrix.arch }}"
          path: |
            ${{ runner.temp }}/phpt-junit.xml
            ${{ runner.temp }}/phpt-results.txt
            tests/**/*.diff
            tests/**/*.exp
            tests/**/*.log
            tests/**/*.mem
            tests/**/*.out
            tests/**/*.php
            tests/**/*.sh
          if-no-files-found: ignore
      - name: Verify extension is loaded
        run: php -n -d extension="$(pwd)/modules/yumemi.so" --ri yumemi

  windows:
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'darwin/')) ||
        (github.event_name == 'push' &&
          (github.ref_name == 'develop' ||
            github.ref_name == 'master' ||
            startsWith(github.ref, 'refs/tags/v'))) ||
        startsWith(github.head_ref || github.ref_name, 'windows/')
      }}
    runs-on: windows-2022
    name: "Windows | PHP ${{ matrix.php-version }} ${{ matrix.ts }} x64"
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.2"
            ts: nts
          - php-version: "8.4"
            ts: nts
          - php-version: "8.4"
            ts: ts
          - php-version: "8.5"
            ts: nts
    steps:
      - uses: actions/checkout@v7
      - name: Build and test the Windows extension
        uses: php/php-windows-builder/extension@v1
        env:
          TEST_PHP_JUNIT: "${{ runner.temp }}/phpt-junit.xml"
        with:
          # The builder embeds this value in Windows filenames, so branch refs
          # containing "/" are not safe here.
          extension-ref: "${{ github.sha }}"
          php-version: "${{ matrix.php-version }}"
          arch: x64
          ts: "${{ matrix.ts }}"
          args: --enable-yumemi
          test-runner-args: >-
            -d open_basedir=
            -d output_buffering=0
            -q
            --offline
            --show-diff
            --show-slow 1000
            --set-timeout 120
            -g FAIL,XFAIL,BORK,WARN,LEAK,SKIP
            -W ${{ runner.temp }}/phpt-results.txt
          test-workers: "1"
      - name: Verify PHPT result policy
        shell: pwsh
        run: |
          $php = Get-ChildItem -Path build -Recurse -Filter php.exe |
            Where-Object { $_.Directory.Name -eq 'php-bin' } |
            Select-Object -First 1
          if ($null -eq $php) {
            throw 'Cannot find the PHP executable used by the Windows builder.'
          }
          & $php.FullName -n scripts/check-phpt-results.php `
            "$env:RUNNER_TEMP/phpt-results.txt" tests
          exit $LASTEXITCODE
      - name: Upload PHPT diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "phpt-windows-${{ matrix.php-version }}-${{ matrix.ts }}-x64"
          path: |
            ${{ runner.temp }}/phpt-junit.xml
            ${{ runner.temp }}/phpt-results.txt
            build/**/tests/**/*.diff
            build/**/tests/**/*.exp
            build/**/tests/**/*.log
            build/**/tests/**/*.mem
            build/**/tests/**/*.out
            build/**/tests/**/*.php
            build/**/tests/**/*.sh
          if-no-files-found: ignore

  nix:
    if: >-
      ${{
        !startsWith(github.head_ref || github.ref_name, 'darwin/') &&
        !startsWith(github.head_ref || github.ref_name, 'windows/')
      }}
    runs-on: ubuntu-latest
    name: Nix
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --keep-going -L
