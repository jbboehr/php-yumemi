name: ci

on:
  push:
    branches:
      - master
      - develop
      - "darwin/**"
      - "windows/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  test:
    if: >-
      ${{
        !startsWith(github.head_ref || github.ref_name, 'darwin/') &&
        !startsWith(github.head_ref || github.ref_name, 'windows/')
      }}
    runs-on: ubuntu-latest
    name: "Test | PHP ${{ matrix.php-version }}"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
      - run: phpize
      - run: ./configure --enable-yumemi
      - run: make
      - run: make test
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_ARGS: "-W ${{ runner.temp }}/phpt-results.txt"
          TEST_PHP_JUNIT: "${{ runner.temp }}/phpt-junit.xml"
      - name: Verify PHPT result policy
        run: php scripts/check-phpt-results.php "$RUNNER_TEMP/phpt-results.txt" tests
      - name: Show PHPT logs
        if: failure()
        run: find tests -name '*.log' -exec cat {} \;
      - name: Upload PHPT diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "phpt-linux-${{ matrix.php-version }}"
          path: |
            ${{ runner.temp }}/phpt-junit.xml
            ${{ runner.temp }}/phpt-results.txt
            tests/**/*.diff
            tests/**/*.exp
            tests/**/*.log
            tests/**/*.mem
            tests/**/*.out
            tests/**/*.php
            tests/**/*.sh
          if-no-files-found: ignore

  macos:
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'windows/')) ||
        (github.event_name == 'push' &&
          (github.ref_name == 'develop' ||
            github.ref_name == 'master' ||
            startsWith(github.ref, 'refs/tags/v'))) ||
        startsWith(github.head_ref || github.ref_name, 'darwin/')
      }}
    name: "macOS | PHP ${{ matrix.php-version }} ${{ matrix.ts }} ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        ts: [nts, zts]
        arch: [arm64]
        runner: [macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
        env:
          phpts: ${{ matrix.ts }}
      - name: Verify PHP build mode
        env:
          PHP_VERSION: ${{ matrix.php-version }}
          PHP_THREAD_SAFETY: ${{ matrix.ts }}
        run: |
          php -n <<'PHP'
          <?php
            $version = PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;
            $ts = PHP_ZTS ? "zts" : "nts";
            if ($version !== getenv("PHP_VERSION") || $ts !== getenv("PHP_THREAD_SAFETY") || PHP_DEBUG) {
                file_put_contents("php://stderr", "Unexpected PHP build: $version $ts\n");
                exit(1);
            }
          PHP
      - run: phpize
      - run: ./configure --enable-yumemi
      - run: make
      # Homebrew ZTS php-config can report NONE for the CLI; use the validated PHP.
      - run: make test PHP_EXECUTABLE="$(command -v php)"
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_ARGS: "-W ${{ runner.temp }}/phpt-results.txt"
          TEST_PHP_JUNIT: "${{ runner.temp }}/phpt-junit.xml"
      - name: Verify PHPT result policy
        run: php scripts/check-phpt-results.php "$RUNNER_TEMP/phpt-results.txt" tests
      - name: Show PHPT logs
        if: failure()
        run: find tests -name '*.log' -exec cat {} \;
      - name: Upload PHPT diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "phpt-macos-${{ matrix.php-version }}-${{ matrix.ts }}-${{ matrix.arch }}"
          path: |
            ${{ runner.temp }}/phpt-junit.xml
            ${{ runner.temp }}/phpt-results.txt
            tests/**/*.diff
            tests/**/*.exp
            tests/**/*.log
            tests/**/*.mem
            tests/**/*.out
            tests/**/*.php
            tests/**/*.sh
          if-no-files-found: ignore
      - name: Verify extension is loaded
        run: php -n -d extension="$(pwd)/modules/yumemi.so" --ri yumemi
      - name: Package macOS ARM64 extension
        id: macos-package
        env:
          PACKAGE_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          PHP_VERSION: ${{ matrix.php-version }}
          PHP_THREAD_SAFETY: ${{ matrix.ts }}
        run: |
          test "$(lipo -archs modules/yumemi.so)" = arm64
          otool -L modules/yumemi.so > "$RUNNER_TEMP/yumemi-libraries.txt"
          cat "$RUNNER_TEMP/yumemi-libraries.txt"
          awk 'NR > 1 && $1 !~ /^\/usr\/lib\// && $1 !~ /^\/System\/Library\// { exit 1 }' \
            "$RUNNER_TEMP/yumemi-libraries.txt"
          package="php_yumemi-${PACKAGE_REF}_php${PHP_VERSION}-arm64-darwin-bsdlibc-${PHP_THREAD_SAFETY}.zip"
          mkdir -p artifacts
          zip -j "artifacts/$package" modules/yumemi.so LICENSE.md docs/LICENSE_EXCEPTION.md docs/UDUNITS-COPYRIGHT
          unzip -q "artifacts/$package" -d "$RUNNER_TEMP/yumemi-package"
          php -n -d extension="$RUNNER_TEMP/yumemi-package/yumemi.so" --ri yumemi
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.macos-package.outputs.package }}
          path: artifacts/${{ steps.macos-package.outputs.package }}
          if-no-files-found: error

  windows:
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'darwin/')) ||
        (github.event_name == 'push' &&
          (github.ref_name == 'develop' ||
            github.ref_name == 'master' ||
            startsWith(github.ref, 'refs/tags/v'))) ||
        startsWith(github.head_ref || github.ref_name, 'windows/')
      }}
    runs-on: windows-2022
    name: "Windows | PHP ${{ matrix.php-version }} ${{ matrix.ts }} x64"
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        ts: [nts, ts]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare license notices for the Windows package
        shell: pwsh
        # The builder includes LICENSE, COPYRIGHT, and COPYING automatically.
        run: |
          Get-Content LICENSE.md, docs/LICENSE_EXCEPTION.md, docs/UDUNITS-COPYRIGHT |
            Set-Content -Encoding utf8 LICENSE
      - name: Build and test the Windows extension
        uses: php/php-windows-builder/extension@v1
        env:
          TEST_PHP_JUNIT: "${{ runner.temp }}/phpt-junit.xml"
        with:
          # PIE matches release assets by tag. SHAs keep branch and PR filenames safe.
          extension-ref: "${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
          php-version: "${{ matrix.php-version }}"
          arch: x64
          ts: "${{ matrix.ts }}"
          args: --enable-yumemi
          test-runner-args: >-
            -d open_basedir=
            -d output_buffering=0
            -q
            --offline
            --show-diff
            --show-slow 1000
            --set-timeout 120
            -g FAIL,XFAIL,BORK,WARN,LEAK,SKIP
            -W ${{ runner.temp }}/phpt-results.txt
          test-workers: "1"
      - name: Verify PHPT result policy
        shell: pwsh
        run: |
          $php = Get-ChildItem -Path build -Recurse -Filter php.exe |
            Where-Object { $_.Directory.Name -eq 'php-bin' } |
            Select-Object -First 1
          if ($null -eq $php) {
            throw 'Cannot find the PHP executable used by the Windows builder.'
          }
          & $php.FullName -n scripts/check-phpt-results.php `
            "$env:RUNNER_TEMP/phpt-results.txt" tests
          exit $LASTEXITCODE
      - name: Upload PHPT diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "phpt-windows-${{ matrix.php-version }}-${{ matrix.ts }}-x64"
          path: |
            ${{ runner.temp }}/phpt-junit.xml
            ${{ runner.temp }}/phpt-results.txt
            build/**/tests/**/*.diff
            build/**/tests/**/*.exp
            build/**/tests/**/*.log
            build/**/tests/**/*.mem
            build/**/tests/**/*.out
            build/**/tests/**/*.php
            build/**/tests/**/*.sh
          if-no-files-found: ignore

  release:
    name: Publish release packages
    needs: [test, macos, windows, nix]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: php_yumemi-*.zip
          path: artifacts
          merge-multiple: true
      - name: Publish the release with binary packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes ""
          fi
          gh release upload "$RELEASE_TAG" artifacts/php_yumemi-*.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  nix-matrix:
    if: >-
      ${{
        !startsWith(github.head_ref || github.ref_name, 'darwin/') &&
        !startsWith(github.head_ref || github.ref_name, 'windows/')
      }}
    runs-on: ubuntu-latest
    name: Nix matrix
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-matrix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-matrix-${{ runner.os }}-${{ runner.arch }}-
      - run: nix flake check --no-build --keep-going -L
      - name: Generate Nix matrix
        id: set-matrix
        run: |
          matrix="$(nix eval --json .#githubActions.matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  nix:
    name: "Nix | ${{ matrix.name }} (${{ matrix.system }})"
    needs: nix-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ matrix.name }}--${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-${{ matrix.system }}-${{ matrix.name }}--${{ hashFiles('flake.lock') }}-
            nix-${{ matrix.system }}-${{ matrix.name }}--
      - name: Build Nix check
        env:
          NIX_ATTR: ${{ matrix.attr }}
        run: nix build --no-link --keep-going -L ".#$NIX_ATTR"
